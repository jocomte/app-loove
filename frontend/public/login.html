<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app-loove - Connexion</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="../src/app.js" defer></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">❤️ app-loove</div>
        <a href="./index.html">S'inscrire</a>
      </nav>
    </header>

    <main>
      <section id="login-section">
        <h1>Se connecter</h1>

        <div id="form-feedback" aria-live="polite"></div>

        <form id="login-form">
          <div>
            <label for="email">Adresse Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemple@domaine.com"
              required
            />
          </div>

          <div>
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit">Connexion</button>
          </form>
            <!-- Verification Section (initialement caché) -->
            <section id="verification-section" style="display:none; margin-top:20px;">
                <h2>Vérification de votre compte</h2>
                <div id="verify-feedback" aria-live="polite"></div>
                <form id="verify-form">
                    <div>
                        <label for="verify-email">Email</label>
                        <input type="email" id="verify-email" name="email" readonly />
                    </div>
                    <div>
                        <label for="verify-code">Code de vérification</label>
                        <input type="text" id="verify-code" name="code" placeholder="Code à 6 chiffres" required />
                    </div>
                    <button type="submit">Vérifier</button>
                </form>
            </section>

        <p style="margin-top: 20px; font-size: 14px; color: #7f8c8d">
          Pas encore de compte ?
          <a
            href="./index.html"
            style="color: #ff5858; text-decoration: none; font-weight: 600"
            >Créez-en un ici</a
          >
        </p>
      </section>
    </main>
  </body>
</html>
