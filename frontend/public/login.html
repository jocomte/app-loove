<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app-loove - Connexion</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="../src/app.js" defer></script>
  </head>
  <body>
    <header>
      <nav>
        <div
          class="logo"
          style="
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, #ff5858 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
        >
          ❤️ app-loove
        </div>
        <a href="./index.html">S'inscrire</a>
      </nav>
    </header>

    <main>
      <section id="login-section">
        <h1>Se connecter</h1>

        <div id="form-feedback" aria-live="polite"></div>

        <form id="login-form">
          <div>
            <label for="email">Adresse Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemple@domaine.com"
              required
            />
          </div>

          <div>
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit">Connexion</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px; color: #7f8c8d">
          Pas encore de compte ?
          <a
            href="./index.html"
            style="color: #ff5858; text-decoration: none; font-weight: 600"
            >Créez-en un ici</a
          >
        </p>
      </section>
    </main>
  </body>
</html>
